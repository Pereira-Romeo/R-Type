name: ChocoCookie

on:
  push:
    branches: [ main ]

jobs:
  push_to_mirror:
    runs-on: ubuntu-latest
    if: github.repository_owner != 'EpitechPGE3-2026'
    steps:
      - name: checkout for push to mirror
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: mirror push the project
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ vars.MIRROR_URL }}
          ssh_private_key: ${{ secrets.GIT_SSH_PRIVATE_KEY }}

